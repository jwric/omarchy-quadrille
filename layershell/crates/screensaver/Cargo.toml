[package]
name = "quadrille-screensaver"
version = "0.0.1"
description = "Technical drawings that plot themselves, sheet after sheet, while the desktop is idle"
edition.workspace = true
license.workspace = true

[[bin]]
name = "quadrille-screensaver"
path = "src/main.rs"

[dependencies]
iced_layer = { path = "../iced_layer" }
quadrille-desktop = { path = "../desktop" }
quadrille.workspace = true
iced_core.workspace = true
iced_futures.workspace = true
iced_graphics.workspace = true
iced_tiny_skia.workspace = true
iced_runtime.workspace = true
iced_renderer.workspace = true
iced_widget = { workspace = true, features = ["canvas"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
fastrand = "2"
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
jiff = "0.2"
log = "0.4"
num-complex = "0.4"
serde_json = "1"
smol = "2"
textwrap = "0.16"
ttf-parser = "0.25"
